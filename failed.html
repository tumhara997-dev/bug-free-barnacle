<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Failed</title>

<!-- Icons CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f3f6fb, #e6ecf5);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card */
.container {
    width: 92%;
    max-width: 380px;
    background: #fff;
    border-radius: 20px;
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    animation: slideUp 0.5s ease;
}

/* Icon circle */
.icon-box {
    width: 80px;
    height: 80px;
    margin: auto;
    border-radius: 50%;
    background: #ffe6e6;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-box i {
    font-size: 36px;
    color: #ff4d4f;
}

/* Title */
h2 {
    margin-top: 20px;
    font-size: 22px;
    color: #222;
}

/* Message */
p {
    margin-top: 10px;
    font-size: 14px;
    color: #666;
    line-height: 1.5;
}

/* Divider */
.divider {
    margin: 20px 0;
    height: 1px;
    background: #eee;
}

/* Button */
.btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

/* Primary button */
.primary {
    background: linear-gradient(135deg, #007bff, #0056d2);
    color: white;
}

.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 15px rgba(0,123,255,0.3);
}

/* Animation */
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon-box">
        <i class="fas fa-times"></i>
    </div>

    <h2>Payment Failed</h2>

    <p id="message">
        Something went wrong while processing your payment.
    </p>

    <div class="divider"></div>

    <button class="btn primary" id="altBtn">
        <i class="fas fa-exchange-alt"></i> Try Another Method
    </button>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const method = params.get("method");

    const message = document.getElementById("message");
    const altBtn = document.getElementById("altBtn");

    if (method === "card") {
        message.innerHTML = 
            "Your <b>card payment</b> could not be completed.<br>Try paying using <b>UPI</b> for a faster experience.";

        altBtn.innerHTML = '<i class="fas fa-qrcode"></i> Pay via UPI';
        altBtn.onclick = () => window.location.href = "screen4.html?method=upi";

    } 
    else if (method === "upi") {
        message.innerHTML = 
            "Your <b>UPI payment</b> failed.<br>You can complete the payment using your <b>card</b> instead.";

        altBtn.innerHTML = '<i class="fas fa-credit-card"></i> Pay via Card';
        altBtn.onclick = () => window.location.href = "screen4.html?method=card";

    } 
    else if (method === "bank") {
        message.innerHTML = 
            "Your <b>Net Banking</b> payment failed.<br>Please try using <b>UPI</b> or <b>Card</b> for a quicker transaction.";

        altBtn.innerHTML = '<i class="fas fa-qrcode"></i> Pay via UPI';
        altBtn.onclick = () => window.location.href = "screen4.html?method=upi";

    } 
    else {
        message.innerHTML = 
            "We couldn't process your payment.<br>Please try using a different method.";

        altBtn.onclick = () => window.location.href = "screen4.html";
    }
</script>

</body>
</html>
